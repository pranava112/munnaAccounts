

# =========================================================
# APPLICATION
# =========================================================

spring.application.name=Accounts
spring.config.import=optional:file:.env[.properties],optional:file:Backend/munnaAccounts/.env[.properties]


# =========================================================
# DATABASE
# =========================================================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false


# =========================================================
# SERVER
# =========================================================

server.port=8081
# spring.servlet.multipart.max-file-size=20MB
# spring.servlet.multipart.max-request-size=22MB

spring.servlet.multipart.max-file-size=40MB
spring.servlet.multipart.max-request-size=40MB


# =========================================================
# JWT SECURITY
# =========================================================

app.security.jwt-secret=${JWT_SECRET}
app.security.refresh-token-days=7
app.security.access-token-minutes=15
app.barcode.directory=${BARCODE_DIRECTORY:}


# =========================================================
# CORS
# =========================================================

app.security.allowed-origins=http://localhost:5173


# =========================================================
# OPENAI
# =========================================================

# openai.api.key=${OPENAI_API_KEY}




# =========================================================
# AI PROVIDER
# =========================================================

# Use Ollama locally by default.
# Change to openai when you want to use OpenAI again.
ai.provider=${AI_PROVIDER:ollama}

# Ollama local configuration
ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:qwen2.5vl:3b}

# OpenAI configuration retained for future use
# Empty key is allowed when Ollama is selected.
openai.api.key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-4.1}



